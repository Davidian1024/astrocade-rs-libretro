[package]
name = "astrocade-rs-libretro"
version = "0.1.0"
edition = "2024"
description = "A Bally Astrocade libretro core written in Rust"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Davidian1024/astrocade-rs-libretro"
keywords = ["libretro", "retroarch", "emulation", "gamedev"]
categories = ["emulators", "game-development"]
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
vergen = { version = "9.1.0", features = ["build"] }

[dependencies]
z80 = "1.0.2"
